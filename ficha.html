<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3a393a">
<title>Ficha do equipamento</title>
<style>
  body{margin:0;font-family:-apple-system,Roboto,Arial,sans-serif;background:#f1f3f6;color:#222}
  #espera{padding:60px 20px;text-align:center;color:#555}
  #espera a{color:#c9272e;font-weight:600}
  #barraFicha{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:#3a393a;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
  #barraFicha button{border:0;border-radius:20px;padding:9px 16px;font:600 15px -apple-system,Roboto,Arial,sans-serif;cursor:pointer}
  #btVoltar{background:rgba(255,255,255,.15);color:#fff} #btFechar{background:#c9272e;color:#fff}
</style>
</head>
<body>
<div id="barraFicha"><button id="btVoltar" type="button">‹ Voltar</button><button id="btFechar" type="button">✕ Fechar</button></div>
<div id="c"><div id="espera">A abrir a ficha…</div></div>
<script>
/* Sair da ficha: voltar atrás; se não houver para onde, fechar a janela; senão abrir a aplicação */
(function () {
  function sair(forcarApp) {
    if (!forcarApp && history.length > 1) { history.back(); return; }
    try { window.close(); } catch (e) {}
    setTimeout(function () { location.href = './'; }, 300);   // se o browser não deixar fechar, vai para a aplicação
  }
  document.getElementById('btVoltar').onclick = function () { sair(false); };
  document.getElementById('btFechar').onclick = function () { sair(true); };
})();
</script>
<script>
/* Mostra a ficha de um equipamento da app dos seriais sem passar pela página do Google
   (que dá "não é possível abrir o ficheiro" quando o telemóvel tem várias contas Google). */
(function () {
  var p = new URLSearchParams(location.search);
  var id = p.get('id') || '', srv = p.get('s') || '';
  var c = document.getElementById('c');
  if (!/^[\w-]{10,}$/.test(id) || !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(srv)) {
    c.innerHTML = '<div id="espera">Link da ficha inválido.</div>'; return;
  }
  var direto = srv + '?id=' + encodeURIComponent(id);
  function pedir(tentativa) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);
    return fetch(srv + '?api=ficha&id=' + encodeURIComponent(id) + '&t=' + Date.now(), ctrl ? { signal: ctrl.signal, cache: 'no-store' } : {})
      .then(function (r) { clearTimeout(t); return r.json(); })
      .catch(function (e) {
        clearTimeout(t);
        if (tentativa < 2) {
          c.innerHTML = '<div id="espera">A ligação está lenta, a tentar de novo…</div>';
          return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return pedir(tentativa + 1); });
        }
        throw e;
      });
  }
  // Passados 5 s sem resposta, mostra já a opção de abrir diretamente
  setTimeout(function () {
    var e = document.getElementById('espera');
    if (e && !document.getElementById('linkDireto')) e.insertAdjacentHTML('beforeend', '<br><br><a id="linkDireto" href="' + direto + '">Está a demorar? Abrir diretamente</a>');
  }, 5000);
  pedir(1)
    .then(function (d) {
      if (!d || !d.ok || !d.html) throw new Error();
      c.innerHTML = d.html;
      var t = c.querySelector('.serial'); if (t) document.title = 'Serial ' + t.textContent.trim();
    })
    .catch(function () {
      // Esta rede/browser bloqueou o pedido (ex.: rede da empresa): abre a ficha diretamente no Google.
      c.innerHTML = '<div id="espera">Esta rede não deixou carregar a ficha aqui.<br>A abrir diretamente no Google…<br><br>' +
        '<a href="' + direto + '">Se não abrir, carregue aqui</a></div>';
      setTimeout(function () { location.href = direto; }, 1200);
    });
})();
</script>
</body>
</html>

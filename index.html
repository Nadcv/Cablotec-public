<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a393a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cablotec">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Cablotec – Produção</title>
<style>
  html, body { margin:0; height:100%; background:#fff; font-family:-apple-system,Roboto,Arial,sans-serif; }
  body { padding-top:env(safe-area-inset-top); box-sizing:border-box; }
  #app { position:fixed; left:0; right:0; bottom:0; top:env(safe-area-inset-top); width:100%; height:calc(100% - env(safe-area-inset-top)); border:0; display:block; }
  #entrada { position:fixed; inset:0; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; z-index:2; transition:opacity .4s; }
  #entrada img { width:62%; max-width:280px; }
  #entrada .barra { width:120px; height:4px; border-radius:2px; background:#eee; overflow:hidden; }
  #entrada .barra i { display:block; width:40%; height:100%; background:#c9272e; animation:anda 1.1s infinite ease-in-out; }
  @keyframes anda { 0% { transform:translateX(-100%); } 100% { transform:translateX(260%); } }
  #entrada p { margin:0; color:#777; font-size:14px; text-align:center; padding:0 24px; }
  #entrada button { border:0; background:#c9272e; color:#fff; font-weight:600; font-size:16px; padding:12px 22px; border-radius:10px; display:none; }
  .oculto { opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="entrada">
  <img src="icons/logo-cablotec.png" alt="Cablotec – Cablagens e Sistemas, Lda">
  <div class="barra"><i></i></div>
  <p id="msg">A abrir a aplicação…</p>
  <button id="bt" onclick="location.reload()">Tentar de novo</button>
</div>
<iframe id="app" title="Cablotec" allow="camera; microphone; geolocation; clipboard-write; fullscreen"></iframe>
<script>
  // Aplicação de produção no Google Apps Script (implementação "CABLOTEC PRODUÇÃO 1")
  var APP = 'https://script.google.com/macros/s/AKfycbw9_T6NTZ3mtogBRbl-pB22E-fdsklHX1lMdiXUr_jk3eB9EGiKAsBAFlvWYa_hb0hi/exec';
  var entrada = document.getElementById('entrada'), msg = document.getElementById('msg'), bt = document.getElementById('bt');
  function semRede() {
    msg.textContent = 'Sem ligação à internet. A aplicação precisa de rede para abrir.';
    document.querySelector('.barra').style.display = 'none'; bt.style.display = 'block';
  }
  if (!navigator.onLine) semRede();
  else {
    var f = document.getElementById('app');
    f.addEventListener('load', function () { entrada.classList.add('oculto'); });
    f.src = APP + location.search;   // passa parâmetros (ex.: ?modo=kiosk)
    setTimeout(function () { if (!entrada.classList.contains('oculto')) msg.textContent = 'A ligar ao servidor… (pode demorar alguns segundos)'; }, 6000);
  }
  window.addEventListener('online', function () { if (bt.style.display === 'block') location.reload(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
